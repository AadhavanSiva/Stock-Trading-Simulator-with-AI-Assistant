# Render Blueprint for the Angular UI + FastAPI front end.
#
# New > Blueprint in the Render dashboard, pick this repo: Render reads this
# file by default. render.flask.yaml beside it deploys the Flask app as a
# separate service. See README, "Deploying".
#
# One service serves both halves from one origin: FastAPI answers /api and
# hands out the built Angular files for everything else (api/spa.py). So
# there is no CORS to configure and one address to register with Google.
#
# Values marked "sync: false" are secrets; Render asks for them when the
# Blueprint is created and they never live in this file.
services:
  - type: web
    name: stock-trading-simulator-angular
    runtime: python
    plan: free
    # Three steps, in the order a failure is cheapest:
    #   1. the API's Python dependencies;
    #   2. init_db, which applies schema.sql and then every migration, both
    #      idempotent, so it is safe on every build and safe to run against
    #      a database the Flask service also builds against;
    #   3. the Angular build into web/dist, which the API then serves. Node
    #      and npm are part of Render's Python runtime; `npm ci` installs
    #      exactly what package-lock.json names.
    buildCommand: pip install -r requirements.txt && python -m portfolio_tracker.init_db && cd web && npm ci && npm run build
    # One process, so the 30 s quote cache is shared. Handlers are sync and
    # run in uvicorn's thread pool, so one slow market-data or assistant
    # call does not hold up the rest.
    startCommand: uvicorn api.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/healthz
    envVars:
      # Matches CI and the Flask service.
      - key: PYTHON_VERSION
        value: 3.13.15
      # Angular 20 needs Node 20.19+ or 22.12+.
      - key: NODE_VERSION
        value: 22.12.0
      # Turns on the production checks: the API refuses to start without
      # JWT_SECRET_KEY or with dev login enabled, and stops publishing
      # /api/docs.
      - key: ENVIRONMENT
        value: production
      # Signs the API's access tokens. Generated once and kept, so a
      # redeploy does not sign everyone out.
      - key: JWT_SECRET_KEY
        generateValue: true
      # The same database as the Flask service, if both are deployed: an
      # account, its cash and its trades are then the same in either.
      - key: DATABASE_URL
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      # Never used by this front end's sign-in, which verifies Google's ID
      # token and needs no secret, but the shared settings count Google as
      # configured only when both values are present.
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      # Market data. Without these the app starts and serves every page,
      # but nothing can be priced — so they are required, not optional.
      - key: ALPACA_API_KEY_ID
        sync: false
      - key: ALPACA_API_SECRET_KEY
        sync: false
