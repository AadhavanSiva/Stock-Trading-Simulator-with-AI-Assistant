# Render Blueprint: New > Blueprint in the Render dashboard, pick this repo.
# Values marked "sync: false" are secrets; Render asks for them when the
# Blueprint is created and they never live in this file. See README, "Deploying".
services:
  - type: web
    name: stock-trading-simulator
    runtime: python
    plan: free
    # init_db applies schema.sql and then every migration, both idempotent,
    # so running it on each build is safe and leaves a fresh database and an
    # upgraded one with the same shape. See README, "Upgrading an existing
    # database".
    buildCommand: pip install -r requirements.txt && python -m portfolio_tracker.init_db
    # One process, so the 30 s quote cache is shared; threads for concurrent
    # requests. The timeout exceeds the assistant's 120 s Gemini time limit.
    startCommand: gunicorn web:app --bind 0.0.0.0:$PORT --workers 1 --threads 8 --timeout 150
    envVars:
      # Matches CI and local development. Nothing now pins the app to
      # 3.10 specifically — pandas did, and it is gone — but keeping one
      # version across all three is what makes CI's result mean anything.
      - key: PYTHON_VERSION
        value: 3.10.4
      - key: BEHIND_HTTPS_PROXY
        value: "1"
      - key: FLASK_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      # Market data. Without these the app starts and serves every page,
      # but nothing can be priced — so they are required, not optional.
      - key: ALPACA_API_KEY_ID
        sync: false
      - key: ALPACA_API_SECRET_KEY
        sync: false
