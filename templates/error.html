{% extends "base.html" %}
{% block title %}{{ code }} · Portfolio Tracker{% endblock %}

{% block content %}
<div class="panel">
    <div class="empty">
        <div class="empty-rule" aria-hidden="true"></div>
        <p class="label">Error {{ code }}</p>
        <h2>{{ message }}</h2>
        <p>
            The address may be mistyped, or the page may have moved. Nothing
            in your account has changed.
        </p>
        <div class="actions">
            <a class="btn btn-primary" href="{{ url_for('index') }}">Back to your portfolio</a>
        </div>
    </div>
</div>
{% endblock %}
